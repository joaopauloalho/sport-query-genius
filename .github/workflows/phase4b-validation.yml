name: Phase 4B Validation

on:
  push:
    branches:
      - feat/phase-4b-team-events-matches-h2h
  pull_request:
    paths:
      - "src/lib/**"
      - "src/components/analysis/**"
      - "src/routes/app.resultado.tsx"
      - "src/server/analysis/**"
      - "src/server/sports/**"
      - "supabase/migrations/**"
      - "tests/phase4a/**"
      - "tests/phase4b/**"
      - "package.json"
      - ".github/workflows/phase4b-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preserve Phase 2B fallback coverage
        run: bun run test:phase2b

      - name: Preserve Phase 3A cache coverage
        run: bun run test:phase3a

      - name: Preserve Phase 3B auth persistence coverage
        run: bun run test:phase3b

      - name: Preserve Phase 3C server protection coverage
        run: bun run test:phase3c

      - name: Preserve Phase 3D entity player coverage
        run: bun run test:phase3d

      - name: Preserve Phase 4A universal-plan coverage
        run: bun run test:phase4a

      - name: Phase 4B team events matches H2H tests
        run: bun run test:phase4b

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        env:
          SUPABASE_SECRET_KEY: phase4b-ci-server-secret-sentinel-do-not-expose
        run: bun run build

      - name: Prove server secret is absent from client bundle
        shell: bash
        run: |
          test -d .output/public
          if grep -R -F 'phase4b-ci-server-secret-sentinel-do-not-expose' .output/public; then
            echo 'Server-only Supabase secret value leaked into client bundle.' >&2
            exit 1
          fi
          if grep -R -F 'SUPABASE_SECRET_KEY' .output/public; then
            echo 'Server-only Supabase env name found in client bundle.' >&2
            exit 1
          fi

      - name: Lint Phase 4B files
        run: >-
          bunx eslint
          src/lib/analysis-result.ts
          src/lib/universal-analysis.ts
          src/server/analysis/analyze.server.ts
          src/server/analysis/analyze-universal.server.ts
          src/server/analysis/errors.ts
          src/server/analysis/usage.server.ts
          src/server/sports/capability-registry.ts
          src/server/sports/competition-matcher.ts
          src/server/sports/payload-cache.server.ts
          src/server/sports/universal-football.ts
          src/server/sports/universal-provider.server.ts
          tests/phase4a/capability-registry.test.ts
          tests/phase4b/engine.test.ts
          tests/phase4b/intent.test.ts
          tests/phase4b/migration.test.ts
          tests/phase4b/provider-contract.test.ts
