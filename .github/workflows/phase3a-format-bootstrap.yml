name: Phase 3A Format Bootstrap

on:
  push:
    branches:
      - feat/phase-3a-sports-cache
    paths:
      - ".github/workflows/phase3a-format-bootstrap.yml"

permissions:
  contents: write

jobs:
  format-phase3a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase-3a-sports-cache

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format only Phase 3A touched files
        run: >-
          bunx prettier --write
          src/server/sports/cache/cached-provider.server.ts
          src/server/sports/cache/repository.ts
          src/server/sports/cache/supabase-repository.server.ts
          src/server/sports/filtered-provider.server.ts
          tests/phase3a/sports-cache.test.mjs

      - name: Commit formatting and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/server/sports/cache/cached-provider.server.ts \
            src/server/sports/cache/repository.ts \
            src/server/sports/cache/supabase-repository.server.ts \
            src/server/sports/filtered-provider.server.ts \
            tests/phase3a/sports-cache.test.mjs
          git rm .github/workflows/phase3a-format-bootstrap.yml
          git commit -m "style: format Phase 3A touched files"
          git push origin HEAD:feat/phase-3a-sports-cache
