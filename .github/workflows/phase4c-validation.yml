name: Phase 4C Validation

on:
  push:
    branches:
      - feat/phase-4c-universal-football-query-engine
  pull_request:
    paths:
      - "src/lib/**"
      - "src/components/analysis/**"
      - "src/routes/app.resultado.tsx"
      - "src/server/analysis/**"
      - "src/server/sports/**"
      - "supabase/migrations/**"
      - "tests/phase4a/**"
      - "tests/phase4b/**"
      - "tests/phase4c/**"
      - "package.json"
      - ".github/workflows/phase4c-validation.yml"
      - "docs/provider-capability-matrix.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Preserve all Phase 2B through 4C coverage
        run: bun run test:phase2b && bun run test:phase3a && bun run test:phase3b && bun run test:phase3c && bun run test:phase3d && bun run test:phase4a && bun run test:phase4b && bun run test:phase4c
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        env:
          SUPABASE_SECRET_KEY: phase4c-ci-server-secret-sentinel-do-not-expose
        run: bun run build
      - name: Prove server secret is absent from client bundle
        shell: bash
        run: |
          test -d .output/public
          ! grep -R -F 'phase4c-ci-server-secret-sentinel-do-not-expose' .output/public
          ! grep -R -F 'SUPABASE_SECRET_KEY' .output/public
      - name: Lint Phase 4C files without mutation
        run: >-
          bunx eslint
          src/lib/analysis-request.ts
          src/components/scoutly/smart-search.tsx
          src/server/analysis/analyze.server.ts
          src/server/analysis/analyze-team-universal.server.ts
          src/server/analysis/deepseek-v4c.server.ts
          src/server/analysis/query-plan.ts
          src/server/analysis/query-plan-v4c-normalizer.ts
          src/server/sports/team-query-capability.ts
          tests/phase4c/engine.test.ts
          tests/phase4c/query-plan.test.ts
      - name: Prove workflow did not mutate tracked code
        run: git diff --exit-code
