name: Phase 4A Format Once

on:
  push:
    branches:
      - feat/phase-4a-universal-query-plan

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/phase-4a-universal-query-plan

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Phase 4A files
        run: >-
          bunx prettier --write
          src/lib/analysis-request.ts
          src/server/analysis/aggregation.ts
          src/server/analysis/deepseek.server.ts
          src/server/analysis/errors.ts
          src/server/analysis/intent-schema.ts
          src/server/analysis/protected-analysis.server.ts
          src/server/analysis/query-plan.ts
          src/server/analysis/query-plan-adapter.ts
          src/server/analysis/query-plan-normalizer.ts
          src/server/sports/capability-registry.ts
          src/server/sports/metric-catalog.ts
          tests/phase4a/aggregation.test.ts
          tests/phase4a/capability-registry.test.ts
          tests/phase4a/query-plan.test.ts

      - name: Commit formatting and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase4a-format-once.yml
          git add src/lib/analysis-request.ts src/server/analysis tests/phase4a src/server/sports/capability-registry.ts src/server/sports/metric-catalog.ts
          git commit -m "style: format Phase 4A files"
          git push origin HEAD:feat/phase-4a-universal-query-plan
