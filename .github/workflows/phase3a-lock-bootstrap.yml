name: Phase 3A Lockfile Bootstrap

on:
  push:
    branches:
      - feat/phase-3a-sports-cache
    paths:
      - "package.json"
      - ".github/workflows/phase3a-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase-3a-sports-cache

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Refresh Bun lockfile
        run: bun install

      - name: Commit generated lockfile and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/phase3a-lock-bootstrap.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh Bun lockfile for Supabase SDK"
          git push origin HEAD:feat/phase-3a-sports-cache
