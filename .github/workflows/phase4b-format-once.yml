name: Phase 4B One-Time Formatter

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase4b-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 4B head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Phase 4B lint targets
        run: >-
          bunx prettier --write
          src/lib/analysis-result.ts
          src/lib/universal-analysis.ts
          src/server/analysis/analyze.server.ts
          src/server/analysis/analyze-universal.server.ts
          src/server/analysis/errors.ts
          src/server/analysis/usage.server.ts
          src/server/sports/capability-registry.ts
          src/server/sports/competition-matcher.ts
          src/server/sports/payload-cache.server.ts
          src/server/sports/universal-football.ts
          src/server/sports/universal-provider.server.ts
          tests/phase4a/capability-registry.test.ts
          tests/phase4b/engine.test.ts
          tests/phase4b/intent.test.ts
          tests/phase4b/migration.test.ts
          tests/phase4b/provider-contract.test.ts

      - name: Verify targeted lint before commit
        run: >-
          bunx eslint
          src/lib/analysis-result.ts
          src/lib/universal-analysis.ts
          src/server/analysis/analyze.server.ts
          src/server/analysis/analyze-universal.server.ts
          src/server/analysis/errors.ts
          src/server/analysis/usage.server.ts
          src/server/sports/capability-registry.ts
          src/server/sports/competition-matcher.ts
          src/server/sports/payload-cache.server.ts
          src/server/sports/universal-football.ts
          src/server/sports/universal-provider.server.ts
          tests/phase4a/capability-registry.test.ts
          tests/phase4b/engine.test.ts
          tests/phase4b/intent.test.ts
          tests/phase4b/migration.test.ts
          tests/phase4b/provider-contract.test.ts

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/phase4b-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/analysis-result.ts src/lib/universal-analysis.ts src/server/analysis/analyze.server.ts src/server/analysis/analyze-universal.server.ts src/server/analysis/errors.ts src/server/analysis/usage.server.ts src/server/sports/capability-registry.ts src/server/sports/competition-matcher.ts src/server/sports/payload-cache.server.ts src/server/sports/universal-football.ts src/server/sports/universal-provider.server.ts tests/phase4a/capability-registry.test.ts tests/phase4b/engine.test.ts tests/phase4b/intent.test.ts tests/phase4b/migration.test.ts tests/phase4b/provider-contract.test.ts .github/workflows/phase4b-format-once.yml
          git commit -m "style: format Phase 4B files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
