name: Phase 3B Format Once

on:
  push:
    branches:
      - feat/phase-3b-auth-user-persistence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/phase-3b-auth-user-persistence

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fix Phase 3B lint formatting
        run: >-
          bunx eslint --fix
          src/lib/auth.tsx
          src/lib/supabase-browser.ts
          src/lib/store.tsx
          src/routes/login.tsx
          src/routes/app.tsx
          src/routes/app.index.tsx
          src/routes/app.historico.tsx
          src/routes/app.salvos.tsx
          src/routes/app.workspaces.tsx
          src/routes/app.perfil.tsx
          src/components/scoutly/app-sidebar.tsx
          src/routes/__root.tsx
          tests/phase3b/auth-persistence.test.mjs

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/lib/auth.tsx \
            src/lib/supabase-browser.ts \
            src/lib/store.tsx \
            src/routes/login.tsx \
            src/routes/app.tsx \
            src/routes/app.index.tsx \
            src/routes/app.historico.tsx \
            src/routes/app.salvos.tsx \
            src/routes/app.workspaces.tsx \
            src/routes/app.perfil.tsx \
            src/components/scoutly/app-sidebar.tsx \
            src/routes/__root.tsx \
            tests/phase3b/auth-persistence.test.mjs
          git commit -m "style: format Phase 3B files"
          git push origin HEAD:feat/phase-3b-auth-user-persistence
