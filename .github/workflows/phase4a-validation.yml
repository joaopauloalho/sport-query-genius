name: Phase 4A Validation

on:
  push:
    branches:
      - feat/phase-4a-universal-query-plan
  pull_request:
    paths:
      - "src/lib/analysis-request.ts"
      - "src/server/analysis/**"
      - "src/server/sports/**"
      - "tests/phase4a/**"
      - "package.json"
      - ".github/workflows/phase4a-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preserve Phase 2B fallback coverage
        run: bun run test:phase2b

      - name: Preserve Phase 3A cache coverage
        run: bun run test:phase3a

      - name: Preserve Phase 3B auth persistence coverage
        run: bun run test:phase3b

      - name: Preserve Phase 3C server protection coverage
        run: bun run test:phase3c

      - name: Preserve Phase 3D entity player coverage
        run: bun run test:phase3d

      - name: Phase 4A universal QueryPlan tests
        run: bun run test:phase4a

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        env:
          SUPABASE_SECRET_KEY: phase4a-ci-server-secret-sentinel-do-not-expose
        run: bun run build

      - name: Prove server secret is absent from client bundle
        shell: bash
        run: |
          test -d .output/public
          if grep -R -F 'phase4a-ci-server-secret-sentinel-do-not-expose' .output/public; then
            echo 'Server-only Supabase secret value leaked into client bundle.' >&2
            exit 1
          fi
          if grep -R -F 'SUPABASE_SECRET_KEY' .output/public; then
            echo 'Server-only Supabase env name found in client bundle.' >&2
            exit 1
          fi

      - name: Lint Phase 4A files
        run: >-
          bunx eslint
          src/lib/analysis-request.ts
          src/server/analysis/aggregation.ts
          src/server/analysis/deepseek.server.ts
          src/server/analysis/errors.ts
          src/server/analysis/intent-schema.ts
          src/server/analysis/protected-analysis.server.ts
          src/server/analysis/query-plan.ts
          src/server/analysis/query-plan-adapter.ts
          src/server/analysis/query-plan-normalizer.ts
          src/server/sports/capability-registry.ts
          src/server/sports/metric-catalog.ts
          tests/phase4a/aggregation.test.ts
          tests/phase4a/query-plan.test.ts
