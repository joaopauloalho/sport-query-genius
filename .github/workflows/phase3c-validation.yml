name: Phase 3C Validation

on:
  push:
    branches:
      - feat/phase-3c-server-usage-protection
  pull_request:
    paths:
      - "src/lib/analysis-request.ts"
      - "src/lib/analysis.functions.ts"
      - "src/server/analysis.functions.ts"
      - "src/server/auth/**"
      - "src/server/analysis/**"
      - "src/server/sports/cache/**"
      - "src/routes/app.resultado.tsx"
      - "supabase/migrations/*phase3c*"
      - "tests/phase3c/**"
      - ".env.example"
      - "package.json"
      - ".github/workflows/phase3c-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preserve Phase 2B fallback coverage
        run: bun run test:phase2b

      - name: Preserve Phase 3A cache coverage
        run: bun run test:phase3a

      - name: Preserve Phase 3B auth persistence coverage
        run: bun run test:phase3b

      - name: Phase 3C tests
        run: bun run test:phase3c

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Prove server secret is absent from client bundle
        shell: bash
        run: |
          test -d .output/public
          if grep -R -E 'SUPABASE_SECRET_KEY|sb_secret_' .output/public; then
            echo 'Server-only Supabase secret marker found in client bundle.' >&2
            exit 1
          fi

      - name: Global lint diagnostic
        continue-on-error: true
        run: bun run lint

      - name: Lint Phase 3C files
        run: >-
          bunx eslint
          src/lib/analysis-request.ts
          src/lib/analysis.functions.ts
          src/server/analysis.functions.ts
          src/server/auth/analysis-auth.server.ts
          src/server/analysis/analyze.server.ts
          src/server/analysis/errors.ts
          src/server/analysis/protected-analysis.server.ts
          src/server/analysis/telemetry.server.ts
          src/server/analysis/usage.server.ts
          src/server/sports/cache/cache-observer.ts
          src/server/sports/cache/cached-provider.server.ts
          src/server/sports/cache/sports-cache.server.ts
          src/routes/app.resultado.tsx
          tests/phase3c/usage-protection.test.mjs
