name: Phase 5B Final Tree Probe

on:
  push:
    branches:
      - tmp/phase5b-publish

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard refs and calculate exact validated final tree
        shell: bash
        run: |
          set -euo pipefail
          expected=54840c65bbe5c0369bc9b309e0b893b04371cee2
          git fetch origin main feat/phase-5b-stage
          test "$(git rev-parse origin/main)" = "$expected"
          test "$(git rev-parse origin/feat/phase-5b-stage)" = "$expected"
          cat .phase5b/chunk{00..09} > /tmp/phase5b-final-files.b64
          base64 -d /tmp/phase5b-final-files.b64 > /tmp/phase5b-final-files.tgz
          echo 'bba7809c76fe3657094d2a491645eb99264e1ff6578d6f55663543bcbcc6a06a  /tmp/phase5b-final-files.tgz' | sha256sum -c -
          git checkout -B phase5b-final origin/main
          tar -xzf /tmp/phase5b-final-files.tgz
          git add -A
          git diff --cached --check
          echo "FINAL_TREE_SHA=$(git write-tree)"
          echo "FINAL_CHANGED_FILES=$(git diff --cached --name-only | wc -l)"
          git diff --cached --stat
