name: Phase 3B Finalize Once

on:
  push:
    branches:
      - feat/phase-3b-auth-user-persistence

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/phase-3b-auth-user-persistence

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply final Phase 3B product updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('src/routes/index.tsx')
          text = index.read_text()
          old = '  "Conta, sincronização em nuvem, cobrança e planos ainda não foram implementados.",'
          new = '  "Cobrança, pagamentos e planos pagos ainda não foram implementados.",'
          if old not in text:
              raise SystemExit('landing limitation marker not found')
          text = text.replace(old, new, 1)
          old = '''            <p className="mt-5 text-sm text-muted-foreground">\n              Sem login e sem cobrança nesta fase. Recursos ainda não suportados ficam fora da\n              navegação principal.\n            </p>'''
          new = '''            <p className="mt-5 text-sm text-muted-foreground">\n              Conta e sincronização em nuvem já estão disponíveis. Cobrança e pagamentos continuam\n              fora desta fase.\n            </p>'''
          if old not in text:
              raise SystemExit('landing login marker not found')
          index.write_text(text.replace(old, new, 1))

          result = Path('src/routes/app.resultado.tsx')
          text = result.read_text()
          old = 'import { Calendar, Download, RefreshCw, Sparkles, Trophy } from "lucide-react";'
          new = 'import { Bookmark, Calendar, Download, RefreshCw, Sparkles, Trophy } from "lucide-react";'
          if old not in text:
              raise SystemExit('result import marker not found')
          text = text.replace(old, new, 1)
          old = '  const { registerAnalysis } = useScoutly();'
          new = '  const { registerAnalysis, toggleSaved, isSaved } = useScoutly();'
          if old not in text:
              raise SystemExit('result store marker not found')
          text = text.replace(old, new, 1)
          old = '''          <Button size="sm" variant="outline" className="gap-1.5" onClick={exportCsv}>\n            <Download className="size-4" /> Exportar CSV\n          </Button>\n          <Button\n            size="sm"\n            variant="ghost"'''
          new = '''          <Button size="sm" variant="outline" className="gap-1.5" onClick={exportCsv}>\n            <Download className="size-4" /> Exportar CSV\n          </Button>\n          <Button\n            size="sm"\n            variant={isSaved(result.cache_key) ? "secondary" : "outline"}\n            className="gap-1.5"\n            onClick={() => {\n              const wasSaved = isSaved(result.cache_key);\n              void toggleSaved(result)\n                .then(() =>\n                  toast.success(\n                    wasSaved ? "Análise removida dos salvos." : "Análise salva na sua conta.",\n                  ),\n                )\n                .catch(() => toast.error("Não foi possível atualizar as análises salvas."));\n            }}\n          >\n            <Bookmark className="size-4" />\n            {isSaved(result.cache_key) ? "Salva" : "Salvar análise"}\n          </Button>\n          <Button\n            size="sm"\n            variant="ghost"'''
          if old not in text:
              raise SystemExit('result action marker not found')
          result.write_text(text.replace(old, new, 1))
          PY

          cat > .env.production <<'EOF'
          # Public browser configuration for Supabase Auth.
          # These values are intentionally publishable; never add SUPABASE_SECRET_KEY here.
          VITE_SUPABASE_URL=https://xuyqlajmtsvnzhqbjwmz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_0YFBwlQ1wLRQ9o3ThQiw2Q_c6qfYp46
          EOF

          cat > supabase/migrations/20260822010000_phase3b_fk_indexes.sql <<'EOF'
          -- Phase 3B hardening: covering indexes for user-persistence foreign keys.
          create index if not exists saved_analyses_history_owner_idx
            on public.saved_analyses (analysis_history_id, user_id);

          create index if not exists workspace_items_history_owner_idx
            on public.workspace_items (analysis_history_id, user_id);

          create index if not exists workspace_items_workspace_owner_idx
            on public.workspace_items (workspace_id, user_id);
          EOF

      - name: Format touched TypeScript
        run: bunx eslint --fix src/routes/index.tsx src/routes/app.resultado.tsx

      - name: Validate before commit
        run: |
          bun run test:phase3b
          bun run typecheck
          bun run build
          bunx eslint src/routes/index.tsx src/routes/app.resultado.tsx

      - name: Commit finalizer output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/routes/index.tsx src/routes/app.resultado.tsx supabase/migrations/20260822010000_phase3b_fk_indexes.sql
          git add -f -- .env.production
          git commit -m "feat: finalize Phase 3B auth experience"
          git push origin HEAD:feat/phase-3b-auth-user-persistence
