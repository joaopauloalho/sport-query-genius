name: Main Truth Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-truth-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun 1.4.0
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Frozen install
        run: bun install --frozen-lockfile

      - name: Phase 5B focused tests
        run: bun run test:phase5b

      - name: Phase 5C parser boundary tests
        run: bun run test:phase5c-parser

      - name: Phase 5C focused tests
        run: bun run test:phase5c

      - name: All regression suites
        run: bun run test:all

      - name: Genius Benchmark
        run: bun run benchmark:genius

      - name: Typecheck
        run: bun run typecheck

      - name: Lint immutable Phase 5C truth surface
        run: >-
          bun x eslint
          src/server/analysis/semantic-plan.ts
          src/server/analysis/query-plan.ts
          src/server/analysis/query-plan-v5a-normalizer.ts
          src/server/analysis/deepseek-v5a.server.ts
          src/server/analysis/phase5c-deterministic-player-parser.ts
          src/server/analysis/execution-plan.ts
          src/server/analysis/trend.ts
          src/server/analysis/analyze.server.ts
          src/server/analysis/analyze-player-universal.server.ts
          src/server/sports/competition-season-registry.ts
          src/server/sports/capability-negotiation.ts
          src/server/sports/capability-negotiation-core.ts
          src/server/sports/metric-catalog.ts
          src/server/sports/team-query-capability.ts
          src/server/sports/player-query-capability.ts
          src/server/sports/fixture-stats.ts
          src/server/sports/player-match-stats.ts
          src/server/sports/player-identity.ts
          src/server/sports/universal-football.ts
          src/server/sports/universal-provider.server.ts
          src/server/sports/universal-player.server.ts
          src/server/analysis/analyze-team-universal.server.ts
          src/server/analysis/analyze-universal.server.ts
          src/server/analysis/phase4c-freshness.server.ts
          src/lib/universal-analysis.ts
          src/lib/analysis-result.ts
          src/components/analysis/universal-result-view.tsx
          src/routes/index.tsx
          tests/genius/benchmark.ts
          tests/genius/truth-gate.test.ts
          tests/genius/phase5c-benchmark.ts
          tests/genius/phase5c-truth-gate.test.ts
          tests/genius/phase5c-natural-language-benchmark.ts
          tests/phase5b/fixture-stats.test.ts
          tests/phase5b/engine.test.ts
          tests/phase5b/helpers.ts
          tests/phase5c/deterministic-player-parser.test.ts
          tests/phase5c/normalization.test.ts
          tests/phase5c/engine.test.ts
          tests/phase5c/helpers.ts

      - name: Build
        env:
          SUPABASE_SECRET_KEY: phase5c-ci-server-secret-sentinel-do-not-expose
        run: bun run build

      - name: Prove server secret is absent from client bundle
        shell: bash
        run: |
          test -d .output/public
          if grep -R -F 'phase5c-ci-server-secret-sentinel-do-not-expose' .output/public; then
            echo 'Server-only Supabase secret value leaked into client bundle.' >&2
            exit 1
          fi
          if grep -R -F 'SUPABASE_SECRET_KEY' .output/public; then
            echo 'Server-only Supabase env name found in client bundle.' >&2
            exit 1
          fi

      - name: Prove validation did not mutate tracked code
        run: git diff --exit-code
