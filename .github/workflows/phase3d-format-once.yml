name: Phase 3D Format Once

on:
  push:
    branches:
      - feat/phase-3d-entity-player-analysis

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase-3d-entity-player-analysis
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format shared Phase 3D files
        run: >-
          bunx prettier --write
          src/server/analysis/analyze.server.ts
          src/routes/app.resultado.tsx
          src/routes/app.jogadores.tsx

      - name: Remove one-shot workflow and commit formatting
        shell: bash
        run: |
          rm .github/workflows/phase3d-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/analysis/analyze.server.ts src/routes/app.resultado.tsx src/routes/app.jogadores.tsx .github/workflows/phase3d-format-once.yml
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: normalize shared Phase 3D files"
          git push origin HEAD:feat/phase-3d-entity-player-analysis
