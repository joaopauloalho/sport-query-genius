name: Phase 2C Validation

on:
  pull_request:
    paths:
      - "src/components/scoutly/app-sidebar.tsx"
      - "src/components/scoutly/smart-search.tsx"
      - "src/routes/app.equipes.tsx"
      - "src/routes/app.explorar.tsx"
      - "src/routes/app.index.tsx"
      - "src/routes/app.jogadores.tsx"
      - "src/routes/app.jogos.tsx"
      - "src/routes/app.resultado.tsx"
      - "src/routes/app.tsx"
      - "src/routes/index.tsx"
      - ".github/workflows/phase2c-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preserve Phase 2B regression coverage
        run: bun run test:phase2b

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Lint Phase 2C files
        run: >-
          bunx eslint
          src/components/scoutly/app-sidebar.tsx
          src/components/scoutly/smart-search.tsx
          src/routes/app.equipes.tsx
          src/routes/app.explorar.tsx
          src/routes/app.index.tsx
          src/routes/app.jogadores.tsx
          src/routes/app.jogos.tsx
          src/routes/app.resultado.tsx
          src/routes/app.tsx
          src/routes/index.tsx
