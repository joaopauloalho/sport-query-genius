name: Phase 3A Validation

on:
  push:
    branches:
      - feat/phase-3a-sports-cache
  pull_request:
    paths:
      - "src/server/analysis/analyze.server.ts"
      - "src/server/sports/cache/**"
      - "tests/phase3a/**"
      - "supabase/migrations/**"
      - "docs/phase3a-sports-cache.md"
      - ".env.example"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/phase3a-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preserve Phase 2B regression coverage
        run: bun run test:phase2b

      - name: Phase 3A unit tests
        run: bun run test:phase3a

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Global lint diagnostic
        continue-on-error: true
        run: bun run lint

      - name: Lint Phase 3A files
        run: >-
          bunx eslint
          src/server/analysis/analyze.server.ts
          src/server/sports/cache/cache-policy.ts
          src/server/sports/cache/cached-provider.server.ts
          src/server/sports/cache/repository.ts
          src/server/sports/cache/sports-cache.server.ts
          src/server/sports/cache/supabase-repository.server.ts
          tests/phase3a/sports-cache.test.mjs
