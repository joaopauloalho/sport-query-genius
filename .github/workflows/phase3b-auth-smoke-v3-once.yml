name: Phase 3B Real Auth Smoke V3 Once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  auth-smoke-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Real Supabase Auth/session/RLS smoke
        env:
          SUPABASE_PUBLIC_URL: https://xuyqlajmtsvnzhqbjwmz.supabase.co
          SUPABASE_PUBLIC_KEY: sb_publishable_0YFBwlQ1wLRQ9o3ThQiw2Q_c6qfYp46
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const url = process.env.SUPABASE_PUBLIC_URL;
          const key = process.env.SUPABASE_PUBLIC_KEY;
          const emailA = 'phase3b-auth-a-c33d9f74b110@proton.me';
          const emailB = 'phase3b-auth-b-fixture-20260822@proton.me';
          const password = 'P3b-c33d9f74b110a7b1!Aa9';
          const cacheA = 'phase3b-real-auth-final-a';
          const workspaceName = 'Phase3B Real Auth Final Workspace';
          const mk = () => createClient(url, key, {
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
          });
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          const a = mk();
          const b = mk();
          const loginA = await a.auth.signInWithPassword({ email: emailA, password });
          if (loginA.error) throw loginA.error;
          const loginB = await b.auth.signInWithPassword({ email: emailB, password });
          if (loginB.error) throw loginB.error;
          assert(loginA.data.session?.access_token, 'A must have a session');
          assert(loginB.data.session?.access_token, 'B must have a session');
          const userA = loginA.data.user.id;
          const userB = loginB.data.user.id;
          assert(userA !== userB, 'A and B must be distinct users');

          await a.from('profiles').upsert({ id: userA, display_name: 'Phase 3B A' }).throwOnError();
          await b.from('profiles').upsert({ id: userB, display_name: 'Phase 3B B' }).throwOnError();

          await a.from('workspace_items').delete().eq('cache_key', cacheA).throwOnError();
          await a.from('saved_analyses').delete().eq('cache_key', cacheA).throwOnError();
          await a.from('analysis_history').delete().eq('cache_key', cacheA).throwOnError();
          await a.from('workspaces').delete().eq('name', workspaceName).throwOnError();

          const historyA = await a.from('analysis_history').insert({
            user_id: userA,
            question: 'Real Auth Final A',
            cache_key: cacheA,
            result_json: { test: 'phase3b-real-auth-final', owner: 'A' },
          }).select('id').single().throwOnError();

          await a.from('saved_analyses').insert({
            user_id: userA,
            analysis_history_id: historyA.data.id,
            cache_key: cacheA,
            result_json: { test: 'phase3b-real-auth-final', owner: 'A' },
          }).throwOnError();

          const workspaceA = await a.from('workspaces').insert({
            user_id: userA,
            name: workspaceName,
            description: 'cross-session final smoke',
          }).select('id').single().throwOnError();

          await a.from('workspace_items').insert({
            workspace_id: workspaceA.data.id,
            user_id: userA,
            analysis_history_id: historyA.data.id,
            cache_key: cacheA,
            result_json: { test: 'phase3b-real-auth-final', owner: 'A' },
          }).throwOnError();

          const own = await a.from('analysis_history').select('id').eq('cache_key', cacheA).throwOnError();
          assert(own.data.length === 1, 'A must see own history');
          const foreignRead = await b.from('analysis_history').select('id').eq('cache_key', cacheA).throwOnError();
          assert(foreignRead.data.length === 0, 'B must not read A history');
          const foreignUpdate = await b.from('analysis_history').update({ question: 'B changed A' }).eq('id', historyA.data.id).select('id').throwOnError();
          assert(foreignUpdate.data.length === 0, 'B must not update A history');
          const foreignDelete = await b.from('saved_analyses').delete().eq('cache_key', cacheA).select('id').throwOnError();
          assert(foreignDelete.data.length === 0, 'B must not delete A saved analysis');

          const refreshed = await a.auth.refreshSession();
          if (refreshed.error) throw refreshed.error;
          assert(refreshed.data.session?.access_token, 'refreshSession must return a session');
          const signout = await a.auth.signOut({ scope: 'local' });
          if (signout.error) throw signout.error;
          const afterLogout = await a.auth.getSession();
          assert(afterLogout.data.session === null, 'local logout must clear session');

          const crossSession = mk();
          const relogin = await crossSession.auth.signInWithPassword({ email: emailA, password });
          if (relogin.error) throw relogin.error;
          assert(relogin.data.session?.access_token, 'relogin must create new session');
          const persistedHistory = await crossSession.from('analysis_history').select('id').eq('cache_key', cacheA).throwOnError();
          const persistedSaved = await crossSession.from('saved_analyses').select('id').eq('cache_key', cacheA).throwOnError();
          const persistedWorkspace = await crossSession.from('workspaces').select('id').eq('id', workspaceA.data.id).throwOnError();
          const persistedItem = await crossSession.from('workspace_items').select('id').eq('workspace_id', workspaceA.data.id).throwOnError();
          assert(persistedHistory.data.length === 1, 'history must persist across session');
          assert(persistedSaved.data.length === 1, 'saved analysis must persist across session');
          assert(persistedWorkspace.data.length === 1, 'workspace must persist across session');
          assert(persistedItem.data.length === 1, 'workspace item must persist across session');

          console.log('PHASE3B_REAL_AUTH_SMOKE=PASS');
          console.log('A_B_ISOLATION=PASS');
          console.log('REFRESH_LOGOUT_RELOGIN=PASS');
          console.log('CROSS_SESSION_PERSISTENCE=PASS');
          NODE
