name: Phase 3D Production Smoke

on:
  push:
    branches:
      - feat/phase-3d-entity-player-analysis
  pull_request:
    paths:
      - ".github/workflows/phase3d-production-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser runner
        shell: bash
        run: |
          mkdir -p /tmp/phase3d-smoke
          cd /tmp/phase3d-smoke
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0 @supabase/supabase-js@2.112.3
          npx playwright install --with-deps chromium >/dev/null

      - name: Run authenticated production smoke
        shell: bash
        env:
          TARGET_URL: https://sport-query-genius.vercel.app
          SUPABASE_URL: https://xuyqlajmtsvnzhqbjwmz.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_0YFBwlQ1wLRQ9o3ThQiw2Q_c6qfYp46
          SMOKE_EMAIL: phase3d-smoke-c0ddf4f1e68c@example.com
          SMOKE_PASSWORD: rLRYC8mKVNuIO0b8n3PvHuwWDHiygUvA
        run: |
          cat >/tmp/phase3d-smoke/smoke.mjs <<'NODE'
          import { chromium } from "playwright";
          import { createClient } from "@supabase/supabase-js";

          const base = process.env.TARGET_URL;
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_PUBLISHABLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          });
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });

          async function bodyText() {
            return (await page.locator("body").innerText()).replace(/\s+/g, " ").trim();
          }

          async function ask(label, question) {
            await page.goto(`${base}/app/resultado?q=${encodeURIComponent(question)}`, {
              waitUntil: "domcontentloaded",
              timeout: 60000,
            });
            await page.waitForFunction(
              () => {
                const text = document.body.innerText;
                return (
                  text.includes("Exportar CSV") ||
                  text.includes("Time não encontrado") ||
                  text.includes("Jogador não encontrado") ||
                  text.includes("Entidade ambígua") ||
                  text.includes("Dados insuficientes") ||
                  text.includes("Provider indisponível") ||
                  text.includes("Limite do provider atingido") ||
                  text.includes("Não foi possível analisar") ||
                  text.includes("DeepSeek indisponível") ||
                  text.includes("Resposta inválida do DeepSeek")
                );
              },
              { timeout: 120000 },
            );
            const text = await bodyText();
            console.log(`SMOKE|${label}|${question}|${text.slice(0, 5000)}`);
            return text;
          }

          try {
            const { data, error } = await supabase.auth.signInWithPassword({
              email: process.env.SMOKE_EMAIL,
              password: process.env.SMOKE_PASSWORD,
            });
            if (error || !data.session || !data.user) {
              console.log(`SMOKE_AUTH_ERROR|${error?.message ?? "missing session"}`);
              throw error ?? new Error("Technical smoke user returned no session");
            }

            const storageKey = "sb-xuyqlajmtsvnzhqbjwmz-auth-token";
            await page.goto(`${base}/login`, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.evaluate(
              ({ key, session }) => localStorage.setItem(key, JSON.stringify(session)),
              { key: storageKey, session: data.session },
            );
            await page.reload({ waitUntil: "networkidle", timeout: 60000 });
            await page.goto(`${base}/app`, { waitUntil: "networkidle", timeout: 60000 });
            const appText = await bodyText();
            console.log(`SMOKE_AUTH|OK|USER_ID=${data.user.id}|${appText.slice(0, 700)}`);
            if (/\/login(?:\?|$)/.test(page.url())) throw new Error("Technical smoke session was not accepted by the app");

            const runs = [
              ["Q1_BAYERN", "Qual foi a média de escanteios do Bayern de Munique nos últimos 5 jogos?"],
              ["Q2_YURI_SHOTS", "Qual foi a média de finalizações do Yuri Alberto nos últimos 5 jogos?"],
              ["Q3_YURI_GOALS", "Quantos gols o Yuri Alberto marcou nos últimos 10 jogos?"],
              ["Q4_YURI_LAST_GOALS", "Quais foram os últimos 5 gols do Yuri Alberto?"],
              ["Q2_YURI_SHOTS_REPEAT", "Qual foi a média de finalizações do Yuri Alberto nos últimos 5 jogos?"],
            ];

            for (const [label, question] of runs) {
              const text = await ask(label, question);
              if (["Não foi possível analisar", "Provider indisponível", "DeepSeek indisponível", "Resposta inválida do DeepSeek", "Time não encontrado", "Jogador não encontrado"].some((marker) => text.includes(marker))) {
                throw new Error(`${label} failed`);
              }
              await page.waitForTimeout(1500);
            }
          } finally {
            await browser.close();
          }
          NODE
          cd /tmp/phase3d-smoke
          node smoke.mjs
