name: Production authenticated smoke

on:
  push:
    branches:
      - smoke/prod-auth-20260824
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install isolated Playwright
        shell: bash
        run: |
          mkdir -p /tmp/scoutly-prod-smoke
          cp "$GITHUB_WORKSPACE/.github/scripts/prod-smoke.mjs" /tmp/scoutly-prod-smoke/prod-smoke.mjs
          cd /tmp/scoutly-prod-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-fund --no-audit playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run authenticated production smoke
        shell: bash
        env:
          BASE_URL: https://sport-query-genius.vercel.app
          SMOKE_EMAIL: smoke.prod.20260824.0740@example.com
          SMOKE_PASSWORD: Scoutly-Smoke-2026!
        run: |
          cd /tmp/scoutly-prod-smoke
          node prod-smoke.mjs
